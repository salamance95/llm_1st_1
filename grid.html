<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    s
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        display: grid;
        width: 100%;
        height: 100vh;
        grid-template-columns: repeat(6, 1fr);
        grid-template-rows: 1fr 1fr 1fr 1fr;
      }
      .item {
        font-family: "Courier New", Courier, monospace;
        font-size: 1.4rem;
        line-height: 4fr;
        font-weight: 700;

        display: flex;
        align-items: center;
        justify-content: center;
      }
      .item1 {
        background-color: red;
        grid-column: auto/span 6;
      }
      .item2 {
        background-color: orange;
        grid-column: 2/4;
      }
      .item3 {
        background-color: lightcoral;
        grid-column: 2/6;
      }
      .item4 {
        background-color: yellow;
        grid-column: auto/span 2;
      }
      .item5 {
        background-color: green;
        grid-column: 2/4;
      }
      .item6 {
        background-color: blue;
        grid-column: 4/6;
      }
      .item7 {
        background-color: purple;
        grid-column: 1/7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item item1">red</div>
      <div class="item item1">orange</div>
      <div class="item item1">lightcoral</div>
      <div class="item item1">yellow</div>
      <div class="item item1">green</div>
      <div class="item item1">blue</div>
      <div class="item item1">purple</div>
    </div>
  </body>
</html>
