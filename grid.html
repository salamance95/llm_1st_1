<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    s
    <style>
      .item {
        width: 60px;
        height: 60px;
        display: grid;
        background-color: lightblue;
        border:2px solid black;
        text-align: center;
        line-height: 60px;
      }
      .cell {

        background-color: lightgray;
        border:2px solid black;
        text-align: center;
        line-height: 56px;
      }
      .s12-items{
        display: grid;
        grid-template-columns: repeat(3,100px);
        grid-template-rows: 80px;
        place-items: center;
        background-color: lightgray;
      }
      .s12-content{
        display: grid;
        grid-template-columns: repeat(3,60px);
        grid-template-rows: 60px;
        place-content: center;
        height: 140px;
        background-color: lightgray;
      }
      .s13-container{
        display: grid;
        grid-template-columns: repeat(3,1fr);
        grid-template-rows: 60px 60px;
        gap:6px;
      }
      .s13-wide{
        grid-column: 1/3;
        /* 열 라인 1~3 사이 2칸 차지 */
        background-color: violet;
      }
      .s13-tall{
        /* 시작점부터 span 2칸 */
        grid-row:1/span 2;
        background-color: lightyellow;
      }
    </style>
  </head>
  <body>
<section>
    <h2>섹션 12. place-items / place-content</h2>
    <p>place-items: center (셀 안 정렬)</p>
    <div class="s12-items">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
    <p>place-content: center (그리드 전체 정렬)</p>
    <div class="s13-container">
      <div class="cell s13-wide">1</div>
      <div class="cell s13-tall">2</div>
      <div class="cell">3</div>
      <div class="cell">4</div>
      <div class="cell">5</div>
    </div>
  </section>
</section>
  </body>
</html>
