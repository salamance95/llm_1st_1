<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .border {
        height: 200px;
        width: 200px;
        background-color: red;
        opacity: 100%;
      }
      .border:hover {
        opacity: 0%;
      }
      .border1 {
        height: 200px;
        width: 200px;
        background-color: blue;
        opacity: 100%;
      }
      .border1:hover {
        visibility: hidden;
      }
      .border2 {
        height: 200px;
        width: 200px;
        background-color: purple;
        opacity: 100%;
      }
      .border2:hover {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="border">opacity</div>
    <div class="border2">display</div>
    <div class="border1">visibility</div>
  </body>
</html>
