<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" placeholder="기본으로 보여주는 화면" required />
    <br />
    <input type="button" />
    <br />
    <input type="password" />
    <br />
    <input type="email" />
    <br />
    <input type="checkbox" />
    <br />
    <input type="radio" />
    <br />
    <input type="date" />
    <br />
    <input type="color" />
    <br />
    <input type="file" />
    <br />
    <input type="range" />

    <form action="">
      <input type="text" name="nickname" placeholder="예: 코딩하는 너구리" />
      <input type="email" name="email" required placeholder="이메일(필수)" />
      <input type="password" />
      <input type="text " value="자동 입력 값" disabled />
      <button type="submit">확인</button>
    </form>

    <label> <input type="checkbox" value="pop" checked /> 팝콘</label>

    <label> <input type="checkbox" value="bev" /> 음료 </label>
    <label
      ><input type="radio" value="basic" name="seat" checked /> 일반석</label
    >
    <label><input type="radio" value="couple" name="seat" /> 커플석</label>
    <!-- name으로 묶어 둘중 하나를 누를 시 하나만 선택됨 -->
    <select name="course">
      <optgroup label="프론트엔드">
        <option value="html" selected>HTML</option>
        <option value="css">CSS</option>
      </optgroup>
      <optgroup label="백엔드">
        <option value="node">Node.js</option>
        <option value="python">Python</option>
      </optgroup>
    </select>
    <!-- label의 for와 input의 id를 연결 -> 사용자명을 누르면 input의 텍스트가 포커싱 -->
    <label for="uname">사용자명</label>
    <input type="text" id="uname" name="username" />
<!-- for+id 연결 없이 라벨링 -->
    <label>이름<input type="text name="username"></label>
  </body>
</html>
