<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        font-family: "Courier New", Courier, monospace;
      }
      li {
        color: green;
      }
      .highlight {
        background-color: yellow;
        color: white;
      }
      #special {
        background-color: pink;
        color: black;
      }
    </style>
  </head>
  <body>
    <!-- cSS작성법 -->
    <section>
      <h1>선택자{속성:값;}</h1>
    </section>

    <!-- 전체 선택자 -->
    <section>
      <p>*덕분에 이 페이지 전체가 같은 글꼴입니다.</p>
    </section>

    <section>
      <ul>
        <li>모든li</li>
        <li></li>
      </ul>
    </section>
    <section>
      <p class="highlight">노란색 형광펜</p>
      <p>클래스 없음-그대로</p>
      <p class="highlight">클래스는 여러곳에 재사용 가능</p>
    </section>
    <section>
      <p id="special">아이디는 중요한 곳에</p>
    </section>
  </body>
</html>
