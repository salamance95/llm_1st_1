<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .bor {
        display: inline-block;
        width: 100px;
        height: 100px;
        border-width: 4px;
        border-style: dotted;
        border-color: blue;
        border-radius: 10px 5px 15px 50px;
      }
      .bord {
        display: inline-block;
        width: 100px;
        height: 100px;
        border-width: 4px;
        border-style: groove;
        border-color: red;
      }
      .borde {
        width: 100px;
        height: 100px;
        padding: 20px;
        border: 15px solid red;
        background-color: orange;
        box-sizing: border-box;
      }
      .border {
        width: 100px;
        height: 100px;
        padding: 20px;
        background-color: orange;
        border: 15px solid red;
        box-sizing: content-box;
      }
    </style>
  </head>
  <body>
    <div class="bor"></div>
    <div class="bord"></div>
    <div class="borde">border-box</div>
    <div class="border">content-box</div>
  </body>
</html>
