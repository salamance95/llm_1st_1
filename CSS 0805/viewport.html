<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--  모든 HTML의 <head>에 반드시 포함- 뷰포트 너비를 기기 너비에 맞춤 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .mq-basic {
        background-color: blue;
        color: white;
        padding: 15px;
        text-align: center;
      }
      @media screen and (min-width: 480px) {
        .mq-basic {
          background-color: lightgreen;
        }
      }
      .mq-max {
        background-color: lightgoldenrodyellow;
        padding: 15px;
        text-align: center;
      }
      @media screen and (max-width: 480px) {
        .mq-max {
          background-color: orange;
        }
      }
      /* 모바일, 테블릿, 데스크톱 */
      /* 모바일 => ~480px */
      /* 테블릿 => 768~1024px */
      /* 데스크톱 => 1024px~ */
    </style>
  </head>
  <body>
    <section>
      <h2>섹션2. @media 기본- min-width</h2>
      <div class="cell mq-basic">
        창 너비 480px 이상이면 연두색, 미만이면 하늘색
      </div>
    </section>
    <section>
      <h2 class="mq-max">창 너비 480px 이하이면 주황색, 초과면 노랑색</h2>
    </section>
    <!-- 768이상 ~ 1024이하  백그라운드를 
     1024 초과=파랑 
     768미만이면 초록
     768~1024 파랑-->
  </body>
</html>
