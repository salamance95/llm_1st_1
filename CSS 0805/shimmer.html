      .hint {

      }
      .box {
        width: 180px;
        height: 180px;
        background-color: red;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      .sketleton {
        width: 260px;
        height: 16px;
        border-radius: 40x;
        margin-bottom: 8px;
        background: linear-gradient(
          90deg,
          #e0e0e0 0%,
          #f5f5f5 50%,
          #e0e0e0 100%
        );
        background-size: 200% 100%;
        animation: shimmer 1.6s infinite linear;
      }
    </style>
  </head>
  <body>
